name: 构建固件 (Build Firmware)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "内核版本（留空 = 自动取 kernel_stable 最新）"
        required: false
        default: ""
        type: string
      base_tag:
        description: "rootfs/boot 基座来源 Release（02/03 的内核需与 kernel_version 同代）"
        required: false
        default: "flashkit_l10"
        type: string
  repository_dispatch:
    types: [kernel-built]

env:
  KERNEL_REPO: ${{ github.repository }}

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve kernel version
        id: ver
        run: |
          if [[ -n "${{ inputs.kernel_version }}" ]]; then
            KERNEL_VER="${{ inputs.kernel_version }}"
          else
            KERNEL_VER=$(curl -fsSL --retry 5 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${KERNEL_REPO}/releases/tags/kernel_stable | \
              jq -r '.assets[] | select(.name | test("^6\\.[0-9]+\\.[0-9]+\\.tar\\.gz$")) | .name' | \
              head -n 1 | sed 's/\.tar\.gz$//')
          fi
          [[ -n "${KERNEL_VER}" && "${KERNEL_VER}" != "null" ]] || { echo "Error: kernel version resolve failed."; exit 1; }
          echo "KERNEL_VER=${KERNEL_VER}" >> ${GITHUB_ENV}
          echo "Kernel version: ${KERNEL_VER}"

      - name: Download kernel bundle
        run: |
          mkdir -p build/kernel && cd build/kernel
          curl -fsSL --retry 5 -C - \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://github.com/${KERNEL_REPO}/releases/download/kernel_stable/${KERNEL_VER}.tar.gz" \
            -o ${KERNEL_VER}.tar.gz
          tar xzf ${KERNEL_VER}.tar.gz
          cd ${KERNEL_VER} && sha256sum -c sha256sums
          echo "bundle files:"; ls -l

      - name: Download base firmware (02_boot + 03_rootfs)
        run: |
          mkdir -p build/base && cd build/base
          BASE_TAG="${{ inputs.base_tag }}"
          for f in 02_boot.img 03_rootfs.img; do
            curl -fsSL --retry 5 -C - \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://github.com/${KERNEL_REPO}/releases/download/${BASE_TAG}/${f}" \
              -o ${f}
          done
          ls -l

      - name: Inject kernel into base firmware
        run: |
          set -e
          VER="${KERNEL_VER}"
          BUND=build/kernel/${VER}
          M=$(mktemp -d)

          # ---------- boot partition ----------
          sudo mount -o loop build/base/02_boot.img ${M}
          # 清掉旧内核文件，只保留 extlinux 引导配置
          sudo find ${M} -maxdepth 1 -mindepth 1 ! -name 'extlinux' -exec rm -rf {} +
          sudo tar xzf ${BUND}/boot-${VER}-ophub.tar.gz -C ${M}
          # dtb：替换 dtb/rockchip 内容（含 wxy 板 dtb 与 overlay）
          sudo rm -rf ${M}/dtb/rockchip && sudo mkdir -p ${M}/dtb/rockchip
          sudo tar xzf ${BUND}/dtb-rockchip-${VER}-ophub.tar.gz -C ${M}/dtb/rockchip
          # 归位 armbian extlinux 约定的文件名
          sudo mv ${M}/vmlinuz-${VER}-ophub ${M}/Image
          sudo mv ${M}/uInitrd-${VER}-ophub ${M}/uInitrd
          sudo rm -f ${M}/initrd.img-${VER}-ophub ${M}/config-${VER}-ophub ${M}/System.map-${VER}-ophub
          test -f ${M}/Image && test -f ${M}/uInitrd && test -f ${M}/dtb/rockchip/rk3566-wxy-oec-turbo-4g.dtb
          sudo cat ${M}/extlinux/extlinux.conf | head -6
          sudo umount ${M}
          sudo e2fsck -fy build/base/02_boot.img > /tmp/e2b.log 2>&1 || true
          echo "-- 02_boot e2fsck --"; tail -2 /tmp/e2b.log

          # ---------- rootfs partition ----------
          sudo mount -o loop build/base/03_rootfs.img ${M}
          # 旧内核模块清掉（只留新版本）
          sudo find ${M}/lib/modules -maxdepth 1 -mindepth 1 -type d ! -name "${VER}-ophub" -exec rm -rf {} +
          sudo rm -rf ${M}/lib/modules/${VER}-ophub
          sudo tar xzf ${BUND}/modules-${VER}-ophub.tar.gz -C ${M}/lib/modules
          # 头文件（可选件，供后续在线编译）
          sudo mkdir -p ${M}/usr/src/linux-headers-${VER}-ophub
          sudo tar xzf ${BUND}/header-${VER}-ophub.tar.gz -C ${M}/usr/src/linux-headers-${VER}-ophub
          sudo depmod -b ${M} ${VER}-ophub
          ls ${M}/lib/modules/
          sudo umount ${M}
          sudo e2fsck -fy build/base/03_rootfs.img > /tmp/e2r.log 2>&1 || true
          echo "-- 03_rootfs e2fsck --"; tail -2 /tmp/e2r.log

          rmdir ${M}
          echo "injection done"

      - name: Build webflash installer FIT (inlined, uses basic U-Boot)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq u-boot-tools xz-utils cpio e2fsprogs fdisk >/dev/null

          # Source parts: base rootfs (26.11 noble + 6.12.81), busybox, basic U-Boot
          mkdir -p build/fit && cd build/fit
          for f in p3-rootfs-base-26.11.img busybox-arm64; do
            curl -fsSL --retry 5 -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://github.com/${KERNEL_REPO}/releases/download/fit_base/${f}" -o ${f}
          done
          cp ../../firmware/u-boot-basic.bin ./u-boot-basic.bin
          BASIC_SHA=$(sha256sum u-boot-basic.bin | awk '{print $1}')
          echo "basic U-Boot sha=${BASIC_SHA}"
          # hard gate: the FIT must embed the webflash no-refresh basic build
          [ "${BASIC_SHA}" = "41d45fecbf60a7740cba25b17585570ebd5fd3b04c095943742d518b0043b59f" ] \
            || { echo "ERROR: u-boot-basic.bin is not the expected webflash fix build"; exit 1; }

          # kernel Image + board dtb from the injected 02_boot.img
          M=$(mktemp -d)
          sudo mount -o loop ../../build/base/02_boot.img ${M}
          cp ${M}/Image ./Image
          cp ${M}/dtb/rockchip/rk3566-wxy-oec-turbo-4g.dtb ./board.dtb
          sudo umount ${M}; rmdir ${M}

          W=$(mktemp -d)
          cp --sparse=always p3-rootfs-base-26.11.img ${W}/rootfs.img
          # root account preconfigured so first boot needs no serial setup.
          # password hash matches the shipped default; override via secret P3_ROOT_SHADOW.
          ROOT_SHADOW="${{ secrets.P3_ROOT_SHADOW }}"
          if [ -z "${ROOT_SHADOW}" ]; then
            ROOT_SHADOW='root:$y$j9T$rCEGAqzCLvR1nnKO/2cJI0$wMEp6MH5fnofhRVtu2ak/QsZAHP8KZHcBOuXb62b013:20778:0:99999:7:::'
          fi

          # 1) debugfs preconfigure: write root shadow + drop first-login marker
          RS=$(debugfs -R 'cat /etc/shadow' ${W}/rootfs.img 2>/dev/null | grep -E '^[a-zA-Z_][a-zA-Z0-9_-]*:')
          printf '%s\n' "$RS" | sed "s|^root:.*|${ROOT_SHADOW}|" > ${W}/shadow.new
          MODE=$(debugfs -R 'stat /etc/shadow' ${W}/rootfs.img 2>/dev/null | sed -n 's/.*Mode: *\([0-9]*\).*/\1/p')
          UIDV=$(debugfs -R 'stat /etc/shadow' ${W}/rootfs.img 2>/dev/null | sed -n 's/.*User: *\([0-9]*\).*/\1/p')
          GIDV=$(debugfs -R 'stat /etc/shadow' ${W}/rootfs.img 2>/dev/null | sed -n 's/.*Group: *\([0-9]*\).*/\1/p')
          debugfs -w -R 'rm /etc/shadow' ${W}/rootfs.img >/dev/null 2>&1
          debugfs -w -R "write ${W}/shadow.new /etc/shadow" ${W}/rootfs.img >/dev/null 2>&1
          INO=$(debugfs -R 'stat /etc/shadow' ${W}/rootfs.img 2>/dev/null | sed -n 's/.*Inode: *\([0-9]*\).*/\1/p')
          debugfs -w -R "sif <${INO}> mode 010${MODE:-640}" ${W}/rootfs.img >/dev/null 2>&1
          debugfs -w -R "sif <${INO}> uid ${UIDV:-0}" ${W}/rootfs.img >/dev/null 2>&1
          debugfs -w -R "sif <${INO}> gid ${GIDV:-42}" ${W}/rootfs.img >/dev/null 2>&1
          debugfs -w -R 'rm /root/.not_logged_in_yet' ${W}/rootfs.img >/dev/null 2>&1
          e2fsck -fy ${W}/rootfs.img >/dev/null 2>&1 || true
          NEWROOT=$(debugfs -R 'cat /etc/shadow' ${W}/rootfs.img 2>/dev/null | grep '^root:')
          [ "${NEWROOT}" = "${ROOT_SHADOW}" ] || { echo "root shadow write failed"; exit 1; }
          echo "rootfs preconfig OK"

          # 2) assemble system.img: GPT + basic U-Boot@LBA64 + (empty boot) + rootfs@LBA819200 + backup GPT
          TOTAL=3125281; SEC=512; UBOOT_LBA=64; BOOT_LBA=32768; ROOTFS_LBA=819200
          truncate -s $((TOTAL*SEC)) ${W}/system.img
          dd if=u-boot-basic.bin of=${W}/system.img bs=512 seek=${UBOOT_LBA} conv=notrunc status=none
          dd if=${W}/rootfs.img of=${W}/system.img bs=512 seek=${ROOTFS_LBA} conv=notrunc status=none
          cat > ${W}/pt <<PT
          label: gpt
          label-id: F42F06FF-9B95-43E3-8B10-8B06CCF0208A
          unit: sectors
          first-lba: 2048
          last-lba: $((TOTAL-33))
          sector-size: 512
          start=${BOOT_LBA}, size=786432, type=0FC63DAF-8483-4772-8E79-3D69D8477DE4, uuid=F4FAEA99-EC94-4949-85D5-DB70858B6403, name="boot"
          start=${ROOTFS_LBA}, size=2306048, type=0FC63DAF-8483-4772-8E79-3D69D8477DE4, uuid=0694B19B-A638-45DC-BCCE-BD2F3AC31A99, name="rootfs"
          PT
          sfdisk --force ${W}/system.img < ${W}/pt >/dev/null 2>&1
          RAWSHA=$(sha256sum ${W}/system.img | awk '{print $1}')
          echo "system.img sha=${RAWSHA}"

          # 3) xz compress
          xz -T0 -9 -c ${W}/system.img > ${W}/system.img.xz
          XZSHA=$(sha256sum ${W}/system.img.xz | awk '{print $1}')

          # 4) installer initramfs (busybox + init with dynamic sha)
          I=${W}/inst; mkdir -p $I/bin $I/dev $I/proc $I/sys $I/tmp
          cp busybox-arm64 $I/bin/busybox; ln -sf busybox $I/bin/sh; cp ${W}/system.img.xz $I/system.img.xz
          cat > $I/init <<INIT
          #!/bin/sh
          /bin/busybox mkdir -p /proc /sys /dev /tmp
          /bin/busybox mount -t proc none /proc
          /bin/busybox mount -t sysfs none /sys
          /bin/busybox mount -t devtmpfs none /dev 2>/dev/null
          export PATH=/bin
          F=/system.img.xz
          EXPECT=${XZSHA}
          RAWSHA=${RAWSHA}
          RAWSECT=${TOTAL}
          echo
          echo "=== P3 webflash installer (kernel ${KERNEL_VER}, Armbian 26.11 noble) ==="
          GOT=\$(sha256sum \$F | awk '{print \$1}')
          [ "\$GOT" = "\$EXPECT" ] || { echo SHA_MISMATCH; exec sh; }
          echo "step 3/5: writing to /dev/mmcblk0 - DO NOT POWER OFF"
          (xzcat \$F | dd of=/dev/mmcblk0 bs=512 conv=fsync 2>/tmp/dd.err) & P=\$!
          while kill -0 \$P 2>/dev/null; do sleep 5; echo "  writing..."; done
          wait \$P; RC=\$?; cat /tmp/dd.err
          [ \$RC -eq 0 ] || { echo WRITE_FAIL; exec sh; }
          echo "step 4/5: readback verify \$RAWSECT sectors"
          (dd if=/dev/mmcblk0 bs=512 count=\$RAWSECT 2>/dev/null | sha256sum >/tmp/v.out) & P=\$!
          while kill -0 \$P 2>/dev/null; do sleep 5; echo "  reading..."; done
          wait \$P; cat /tmp/v.out
          grep -q \$RAWSHA /tmp/v.out && { echo FLASH_OK; sync; sleep 3; reboot -f; } || { echo READBACK_MISMATCH; exec sh; }
          INIT
          chmod +x $I/init
          (cd $I && find . -print0 | cpio --null -o -H newc | gzip -9 > ${W}/initrd.gz)

          # 5) FIT via mkimage
          IMG_ABS="$(pwd)/Image"; DTB_ABS="$(pwd)/board.dtb"; RD_ABS="${W}/initrd.gz"
          cat > ${W}/i.its <<ITS
          /dts-v1/;
          / { description="P3 webflash installer ${KERNEL_VER}"; #address-cells=<1>;
            images {
              k { description="kernel"; data = /incbin/("${IMG_ABS}"); type="kernel"; arch="arm64"; os="linux"; compression="none"; load=<0x20000000>; entry=<0x20000000>; h { algo="sha256"; }; };
              r { description="initramfs"; data = /incbin/("${RD_ABS}"); type="ramdisk"; arch="arm64"; os="linux"; compression="none"; load=<0x24000000>; h { algo="sha256"; }; };
              f { description="dtb"; data = /incbin/("${DTB_ABS}"); type="flat_dt"; arch="arm64"; compression="none"; load=<0x40000000>; h { algo="sha256"; }; };
            };
            configurations { default="c"; c { kernel="k"; ramdisk="r"; fdt="f"; }; };
          };
          ITS
          FIT=../../build/output/p3-installer-${KERNEL_VER}.fit
          mkdir -p ../../build/output
          mkimage -f ${W}/i.its ${FIT}
          FSHA=$(sha256sum ${FIT} | awk '{print $1}')

          # verify bootarea embeds the exact basic U-Boot
          UBSHA=$(dd if=${W}/system.img bs=512 skip=64 count=$(( $(stat -c%s u-boot-basic.bin)/512 )) 2>/dev/null | sha256sum | awk '{print $1}')
          [ "${UBSHA}" = "${BASIC_SHA}" ] || { echo "bootarea U-Boot mismatch"; exit 1; }
          printf '%s  p3-installer-%s.fit\n' "${FSHA}" "${KERNEL_VER}" > ../../build/output/FIT_SHA256.txt
          echo "FIT built: ${FIT} sha=${FSHA}"
          echo "FIT_VER=${KERNEL_VER}" >> ${GITHUB_ENV}
          rm -rf ${W}

      - name: Assemble firmware set (01/02/03/slim + SHA256SUMS)
        run: |
          set -e
          OUT=build/output; mkdir -p ${OUT}
          cp build/base/02_boot.img build/base/03_rootfs.img ${OUT}/
          cp firmware/01_gpt_bootarea_l10h.img firmware/01_gpt_bootarea_l10g.img firmware/p3boot ${OUT}/

          # ---- slim：flashkit 布局整盘镜像（01 引导区 + boot@32768 + rootfs@819200）----
          BOOT_START=32768; ROOT_START=819200; BOOT_SECS=786432
          ROOT_SECS=$(stat -c%s ${OUT}/03_rootfs.img | awk '{printf "%d", $1/512 + ($1%512?1:0)}')
          SLIM_SECS=$((ROOT_START + ROOT_SECS + 33))
          truncate -s $((SLIM_SECS * 512)) ${OUT}/slim.raw
          dd if=firmware/01_gpt_bootarea_l10h.img of=${OUT}/slim.raw conv=notrunc status=none
          dd if=${OUT}/02_boot.img  of=${OUT}/slim.raw bs=512 seek=${BOOT_START} conv=notrunc status=none
          dd if=${OUT}/03_rootfs.img of=${OUT}/slim.raw bs=512 seek=${ROOT_START} conv=notrunc status=none
          cd ${OUT}
          sfdisk --force slim.raw <<PTABLE
          label: gpt
          unit: sectors
          slim.raw1 : start=${BOOT_START}, size=${BOOT_SECS}, type=0FC63DAF-8483-4772-8E79-3D69D8477DE4, name="boot"
          slim.raw2 : start=${ROOT_START}, size=${ROOT_SECS}, type=0FC63DAF-8483-4772-8E79-3D69D8477DE4, name="rootfs"
          PTABLE
          sfdisk -d slim.raw
          echo "slim: $(du -m slim.raw | cut -f1)MB (rootfs ${ROOT_SECS} sectors)"
          # sanity: slim 的 p1 应能挂载看到 extlinux
          LOOP=$(sudo losetup -Pf --show slim.raw)
          sudo mkdir -p /mnt/slimchk && sudo mount -o ro ${LOOP}p1 /mnt/slimchk
          sudo ls /mnt/slimchk/extlinux/extlinux.conf /mnt/slimchk/Image /mnt/slimchk/uInitrd > /dev/null && echo "slim p1 OK"
          sudo umount /mnt/slimchk && sudo losetup -d ${LOOP}
          gzip -k9 slim.raw && mv slim.raw.gz p3_armbian_slim.img.gz && rm slim.raw

          # ---- 校验清单 ----
          sha256sum 01_gpt_bootarea_l10h.img 01_gpt_bootarea_l10g.img p3boot 02_boot.img 03_rootfs.img p3_armbian_slim.img.gz > SHA256SUMS.txt
          [ -f FIT_SHA256.txt ] && cat FIT_SHA256.txt >> SHA256SUMS.txt || true
          cat SHA256SUMS.txt
          echo "FIRMWARE_TAG=firmware_$(date +%Y.%m)" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}
        id: pack

      - name: Upload firmware set to Release
        uses: ophub/upload-to-releases@main
        if: ${{ steps.pack.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ env.FIRMWARE_TAG }}
          artifacts: build/output/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: false
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### P3 固件套件（CI 构建，内核 ${{ env.KERNEL_VER }}）
            | 文件 | 用途 |
            |---|---|
            | 01_gpt_bootarea_l10h.img / _l10g.img | GPT + L10 引导（二选一：日常 l10h，反复刷机 l10g）`wl 0x0` |
            | 02_boot.img | boot 分区（内核 Image/uInitrd/dtb 出厂即对）`wl 0x8000` |
            | 03_rootfs.img | rootfs 分区（首启自动扩容）`wl 0xC8000` |
            | p3_armbian_slim.img.gz | U 盘整盘镜像（Rufus/Etcher 写入） |
            | p3boot | U 盘 / eMMC 启动切换脚本 |
            | p3-installer-${{ env.FIT_VER }}.fit | webflash 整盘 installer FIT（内嵌 basic U-Boot 修复版 + 预配置 Armbian 26.11 noble） |
            - 用 FIT 前先刷仓库 `firmware/u-boot-basic.bin`（webflash 免刷新修复版，sha 41d45fec）到 LBA64，FIT 写盘会再次写入同一 basic
            - SHA256SUMS.txt 覆盖以上全部文件
            - 刷机命令见仓库 `firmware/README.md`
