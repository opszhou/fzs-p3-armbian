name: 构建固件 (Build Firmware)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "内核版本（留空 = 自动取 kernel_stable 最新）"
        required: false
        default: ""
        type: string
      base_tag:
        description: "基座来源 Release；留空 = 自动取最新一个同时有 02_boot.img 与 03_rootfs.img 的 Release"
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [kernel-built]

env:
  KERNEL_REPO: ${{ github.repository }}

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GPT images from source
        run: |
          set -e
          python3 tools/mkgpt.py --out-dir build/gpt --verify firmware
          echo "GPT images reproduced byte-for-byte from tools/mkgpt.py"
          # Single source of truth for the disk geometry: every tool that
          # rejects out-of-range flashes reads this value, never a literal.
          echo "P3_DISK_SECTORS=$(python3 tools/mkgpt.py --print-sector)" >> $GITHUB_ENV

      - name: Resolve kernel version
        id: ver
        run: |
          if [[ -n "${{ inputs.kernel_version }}" ]]; then
            KERNEL_VER="${{ inputs.kernel_version }}"
          else
            KERNEL_VER=$(curl -fsSL --retry 5 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${KERNEL_REPO}/releases/tags/kernel_stable | \
              jq -r '.assets[] | select(.name | test("^6\\.[0-9]+\\.[0-9]+\\.tar\\.gz$")) | .name' | \
              head -n 1 | sed 's/\.tar\.gz$//')
          fi
          [[ -n "${KERNEL_VER}" && "${KERNEL_VER}" != "null" ]] || { echo "Error: kernel version resolve failed."; exit 1; }
          echo "KERNEL_VER=${KERNEL_VER}" >> ${GITHUB_ENV}
          echo "Kernel version: ${KERNEL_VER}"

      - name: Download kernel bundle
        run: |
          mkdir -p build/kernel && cd build/kernel
          curl -fsSL --retry 5 -C - \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://github.com/${KERNEL_REPO}/releases/download/kernel_stable/${KERNEL_VER}.tar.gz" \
            -o ${KERNEL_VER}.tar.gz
          tar xzf ${KERNEL_VER}.tar.gz
          cd ${KERNEL_VER} && sha256sum -c sha256sums
          echo "bundle files:"; ls -l

      - name: Download base firmware (02_boot + 03_rootfs)
        run: |
          mkdir -p build/base && cd build/base
          BASE_TAG="${{ inputs.base_tag }}"
          AUTH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          fetch_base() {  # $1 = tag
            for f in 02_boot.img 03_rootfs.img; do
              curl -fsSL --retry 5 -H "Accept: application/octet-stream" -H "$AUTH" \
                "https://github.com/${KERNEL_REPO}/releases/download/$1/${f}" -o "${f}" || return 1
            done
          }
          if [ -n "${BASE_TAG}" ]; then
            fetch_base "${BASE_TAG}" || { echo "ERROR: pinned base tag ${BASE_TAG} fetch failed"; exit 1; }
          elif fetch_base base_firmware; then
            # rolling internal release: every build refreshes the pair here,
            # so the public firmware releases no longer need to carry them
            BASE_TAG=base_firmware
          else
            # legacy fallback: latest public release that still carries the pair
            BASE_TAG=$(curl -fsSL --retry 5 -H "Accept: application/vnd.github+json" -H "$AUTH" \
              "https://api.github.com/repos/${KERNEL_REPO}/releases?per_page=30" | \
              jq -r '[.[] | select(([.assets[].name] | index("02_boot.img")) != null)
                     | select(([.assets[].name] | index("03_rootfs.img")) != null)]
                     | .[0].tag_name // empty')
            [ -n "${BASE_TAG}" ] || { echo "no release carries both 02_boot.img and 03_rootfs.img"; exit 1; }
            fetch_base "${BASE_TAG}" || { echo "ERROR: base fetch failed"; exit 1; }
          fi
          echo "base tag: ${BASE_TAG}"
          ls -l

      # Without this, a stick made from this image carries exactly the same
      # rootfs UUID as the eMMC it was copied from, and root=UUID= resolves to
      # whichever device probes first (the eMMC) -- "boot from USB" then
      # silently boots the eMMC. The baked one-shot renames this installation's
      # rootfs and /boot on first boot, so the collision cannot come back.
      - name: Bake first-boot setup (default login, unique UUIDs)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs util-linux >/dev/null
          bash tools/p3-firstboot-inject.sh build/base/03_rootfs.img
          bash tools/p3-firstboot-inject.sh --seed-only build/base/02_boot.img

      - name: Inject kernel into base firmware
        run: |
          set -e
          VER="${KERNEL_VER}"
          BUND=build/kernel/${VER}
          M=$(mktemp -d)

          # ---------- boot partition ----------
          sudo mount -o loop build/base/02_boot.img ${M}
          # 清掉旧内核文件，只保留 extlinux 引导配置
          sudo find ${M} -maxdepth 1 -mindepth 1 ! -name 'extlinux' -exec rm -rf {} +
          sudo tar xzf ${BUND}/boot-${VER}-ophub.tar.gz -C ${M}
          # dtb：替换 dtb/rockchip 内容（含 wxy 板 dtb 与 overlay）
          sudo rm -rf ${M}/dtb/rockchip && sudo mkdir -p ${M}/dtb/rockchip
          sudo tar xzf ${BUND}/dtb-rockchip-${VER}-ophub.tar.gz -C ${M}/dtb/rockchip
          # 归位 armbian extlinux 约定的文件名
          sudo mv ${M}/vmlinuz-${VER}-ophub ${M}/Image
          sudo mv ${M}/uInitrd-${VER}-ophub ${M}/uInitrd
          sudo rm -f ${M}/initrd.img-${VER}-ophub ${M}/config-${VER}-ophub ${M}/System.map-${VER}-ophub
          test -f ${M}/Image && test -f ${M}/uInitrd && test -f ${M}/dtb/rockchip/rk3566-wxy-oec-turbo-4g.dtb
          sudo cat ${M}/extlinux/extlinux.conf | head -6
          sudo umount ${M}
          sudo e2fsck -fy build/base/02_boot.img > /tmp/e2b.log 2>&1 || true
          echo "-- 02_boot e2fsck --"; tail -2 /tmp/e2b.log

          # ---------- rootfs partition ----------
          sudo mount -o loop build/base/03_rootfs.img ${M}
          # 旧内核模块清掉（只留新版本）
          sudo find ${M}/lib/modules -maxdepth 1 -mindepth 1 -type d ! -name "${VER}-ophub" -exec rm -rf {} +
          sudo rm -rf ${M}/lib/modules/${VER}-ophub
          sudo tar xzf ${BUND}/modules-${VER}-ophub.tar.gz -C ${M}/lib/modules
          # 头文件（可选件，供后续在线编译）
          sudo mkdir -p ${M}/usr/src/linux-headers-${VER}-ophub
          sudo tar xzf ${BUND}/header-${VER}-ophub.tar.gz -C ${M}/usr/src/linux-headers-${VER}-ophub
          sudo depmod -b ${M} ${VER}-ophub
          ls ${M}/lib/modules/
          sudo umount ${M}
          sudo e2fsck -fy build/base/03_rootfs.img > /tmp/e2r.log 2>&1 || true
          echo "-- 03_rootfs e2fsck --"; tail -2 /tmp/e2r.log

          rmdir ${M}
          echo "injection done"

      - name: Build webflash FIT (generic P3WFS1 flow, bootarea preserved)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq u-boot-tools xz-utils cpio e2fsprogs fdisk >/dev/null

          # Source parts: base rootfs (26.11 noble + 6.12.81), busybox.
          # FIT contains NO U-Boot: installer writes only LBA32768+ (boot/rootfs),
          # preserving whatever U-Boot is on the board (any version).
          mkdir -p build/fit && cd build/fit
          for f in p3-rootfs-base-26.11.img busybox-arm64; do
            curl -fsSL --retry 5 -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://github.com/${KERNEL_REPO}/releases/download/fit_base/${f}" -o ${f}
          done
          # same first-boot payload as the 02/03 path (separate rootfs baseline)
          bash ../../tools/p3-firstboot-inject.sh p3-rootfs-base-26.11.img
          # Paired bootloader gate. The sha lives in firmware/SHA256SUMS.txt, so
          # dropping a new U-Boot build is "replace bin + regenerate sums" -- there
          # is no sha hardcoded in this workflow to go stale.
          ( cd ../../firmware && sha256sum -c SHA256SUMS.txt --ignore-missing ) \
            || { echo "ERROR: firmware/u-boot.bin does not match firmware/SHA256SUMS.txt"; exit 1; }
          UBOOT_VER=$(tr -d ' \n' < ../../firmware/u-boot.version)
          # year-agnostic: the release cadence has already crossed 2025 -> 2026;
          # "|| true" guards set -e when grep misses, the -n check reports it.
          UBOOT_TXT=$(strings ../../firmware/u-boot.bin | grep -m1 "U-Boot 20") || true
          [ -n "${UBOOT_VER}" ] || { echo "ERROR: firmware/u-boot.version is empty"; exit 1; }
          [ -n "${UBOOT_TXT}" ] || { echo "ERROR: no U-Boot version string in firmware/u-boot.bin"; exit 1; }
          # tier segment dropped: tiers merged into a runtime gate in 2.4.0, the
          # suffix is now "-fzs_p3" instead of "-basic-"; match on "-<ver>-" only.
          case "${UBOOT_TXT}" in *"-${UBOOT_VER}-"*) ;;
            *) echo "ERROR: binary says '${UBOOT_TXT}', version file says ${UBOOT_VER}"; exit 1 ;;
          esac
          echo "paired U-Boot: ${UBOOT_VER} (${UBOOT_TXT})"
          echo "UBOOT_VER=${UBOOT_VER}" >> ${GITHUB_ENV}

          # kernel Image + board dtb from the injected 02_boot.img
          M=$(mktemp -d)
          sudo mount -o loop ../../build/base/02_boot.img ${M}
          cp ${M}/Image ./Image
          cp ${M}/dtb/rockchip/rk3566-wxy-oec-turbo-4g.dtb ./board.dtb
          sudo umount ${M}; rmdir ${M}

          W=$(mktemp -d)
          cp --sparse=always p3-rootfs-base-26.11.img ${W}/rootfs.img
          # root account preconfigured so first boot needs no serial setup.
          # password hash matches the shipped default; override via secret P3_ROOT_SHADOW.
          ROOT_SHADOW="${{ secrets.P3_ROOT_SHADOW }}"
          if [ -z "${ROOT_SHADOW}" ]; then
            ROOT_SHADOW='root:$y$j9T$rCEGAqzCLvR1nnKO/2cJI0$wMEp6MH5fnofhRVtu2ak/QsZAHP8KZHcBOuXb62b013:20778:0:99999:7:::'
          fi

          # 1) debugfs preconfigure: write root shadow + drop first-login marker
          RS=$(debugfs -R 'cat /etc/shadow' ${W}/rootfs.img 2>/dev/null | grep -E '^[a-zA-Z_][a-zA-Z0-9_-]*:')
          printf '%s\n' "$RS" | sed "s|^root:.*|${ROOT_SHADOW}|" > ${W}/shadow.new
          MODE=$(debugfs -R 'stat /etc/shadow' ${W}/rootfs.img 2>/dev/null | sed -n 's/.*Mode: *\([0-9]*\).*/\1/p')
          UIDV=$(debugfs -R 'stat /etc/shadow' ${W}/rootfs.img 2>/dev/null | sed -n 's/.*User: *\([0-9]*\).*/\1/p')
          GIDV=$(debugfs -R 'stat /etc/shadow' ${W}/rootfs.img 2>/dev/null | sed -n 's/.*Group: *\([0-9]*\).*/\1/p')
          debugfs -w -R 'rm /etc/shadow' ${W}/rootfs.img >/dev/null 2>&1
          debugfs -w -R "write ${W}/shadow.new /etc/shadow" ${W}/rootfs.img >/dev/null 2>&1
          INO=$(debugfs -R 'stat /etc/shadow' ${W}/rootfs.img 2>/dev/null | sed -n 's/.*Inode: *\([0-9]*\).*/\1/p')
          debugfs -w -R "sif <${INO}> mode 010${MODE:-640}" ${W}/rootfs.img >/dev/null 2>&1
          debugfs -w -R "sif <${INO}> uid ${UIDV:-0}" ${W}/rootfs.img >/dev/null 2>&1
          debugfs -w -R "sif <${INO}> gid ${GIDV:-42}" ${W}/rootfs.img >/dev/null 2>&1
          debugfs -w -R 'rm /root/.not_logged_in_yet' ${W}/rootfs.img >/dev/null 2>&1
          e2fsck -fy ${W}/rootfs.img >/dev/null 2>&1 || true
          NEWROOT=$(debugfs -R 'cat /etc/shadow' ${W}/rootfs.img 2>/dev/null | grep '^root:')
          [ "${NEWROOT}" = "${ROOT_SHADOW}" ] || { echo "root shadow write failed"; exit 1; }
          echo "rootfs preconfig OK"

          # 2) assemble data image: ONLY partition area from LBA32768 onward.
          #    LBA0-32767 (protective MBR + GPT + U-Boot bootarea) is NEVER touched
          #    by the installer, so whatever U-Boot the board has (any)
          #    is preserved. This is a hard product rule.
          # TOTAL = whole-disk sectors (from mkgpt.py, via GITHUB_ENV).
          # ROOTFS_SECTORS = the actual rootfs IMAGE length in sectors,
          # NOT the partition capacity (29716447) - it sizes data.img exactly.
          TOTAL=${P3_DISK_SECTORS:?P3_DISK_SECTORS not exported by GPT step}
          SEC=512; BOOT_LBA=32768; ROOTFS_LBA=819200; ROOTFS_SECTORS=2306048
          DATA_START=${BOOT_LBA}                              # 32768
          # write exactly boot + rootfs partitions; do NOT touch main GPT, bootarea, or backup GPT
          DATA_SECT=$((ROOTFS_LBA + ROOTFS_SECTORS - DATA_START))   # 3125248-32768 = 3092480 sectors
          truncate -s $((DATA_SECT*SEC)) ${W}/data.img
          # boot partition @relative LBA0 (the injected 02_boot.img with 6.12.81 kernel
          # + extlinux), rootfs @relative (ROOTFS_LBA-DATA_START). Neither touches bootarea.
          dd if=../../build/base/02_boot.img of=${W}/data.img bs=512 seek=0 conv=notrunc status=none
          dd if=${W}/rootfs.img of=${W}/data.img bs=512 seek=$((ROOTFS_LBA-DATA_START)) conv=notrunc status=none
          # rootfs base image carries a 33-sector tail (disk-end GPT copy from when it
          # was sliced off the full image). Clamp data.img to exactly DATA_SECT so the
          # written size == readback size, and the board's disk-end GPT stays untouched.
          truncate -s $((DATA_SECT*SEC)) ${W}/data.img
          # build a standalone GPT for the data segment? NO - we keep the board's GPT.
          # data.img is a raw partition-content blob; installer writes it at LBA32768.
          DATA_SHA=$(sha256sum ${W}/data.img | awk '{print $1}')
          echo "data.img sha=${DATA_SHA} sectors=${DATA_SECT} (maps to disk LBA ${DATA_START}..$((TOTAL-1)))"

          # 4) pack as a generic self-describing webflash image (P3WFS1) and build the FIT.
          #    Same tools are published in tools/ so ANYONE can pack and flash their own
          #    image: mkwebflash.sh -> p3wfs-check.sh -> mkfit.sh. The on-board installer
          #    parses the image header and enforces LBA>=32768 (bootarea protection) itself.
          #    Whole-disk third-party images (xz/gzip/raw GPT) are also supported at
          #    flash time: gptparse locates boot/rootfs inside the image; the installer
          #    writes ONLY the board's fixed partitions (boot@32768, rootfs@819200).
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu >/dev/null
          aarch64-linux-gnu-gcc -static -O2 -s -o ./gptparse ../../tools/gptparse.c
          chmod +x ../../tools/mkwebflash.sh ../../tools/p3wfs-check.sh ../../tools/mkfit.sh
          bash ../../tools/mkwebflash.sh ${W}/data.img ${W}/system.wfs 32768
          bash ../../tools/p3wfs-check.sh ${W}/system.wfs ${TOTAL}

          FIT=../../build/output/p3-installer-${KERNEL_VER}.fit
          mkdir -p ../../build/output
          bash ../../tools/mkfit.sh ${W}/system.wfs ./Image ./board.dtb busybox-arm64 ${FIT} ${TOTAL} ./gptparse
          # FIT ships UNCOMPRESSED: its payload is already xz inside (outer compression
          # would save ~2% only). Users download and upload it to webflash AS-IS.
          FSHA=$(sha256sum ${FIT} | awk '{print $1}')

          # FIT embeds NO U-Boot; bootarea is preserved on the board.
          # U-Boot sha was gated at source above (UBOOT_SHA) as the paired bootloader.
          printf '%s  p3-installer-%s.fit\n' "${FSHA}" "${KERNEL_VER}" > ../../build/output/FIT_SHA256.txt
          echo "FIT built: ${FIT} sha=${FSHA}"
          echo "FIT_VER=${KERNEL_VER}" >> ${GITHUB_ENV}
          rm -rf ${W}

      - name: Assemble firmware set (01/02/03/slim + SHA256SUMS)
        run: |
          set -e
          OUT=build/output; mkdir -p ${OUT}
          # public release ships 4 files only (FIT / img.xz / bootarea.img /
          # SHA256SUMS.txt).  Intermediates live in build/base and firmware/;
          # the pair in build/base is published to the rolling base_firmware
          # release by a later step.

          # ---- slim：flashkit 布局整盘镜像（01 引导区 + boot@32768 + rootfs@819200）----
          BOOT_START=32768; ROOT_START=819200; BOOT_SECS=786432
          ROOT_SECS=$(stat -c%s build/base/03_rootfs.img | awk '{printf "%d", $1/512 + ($1%512?1:0)}')
          SLIM_SECS=$((ROOT_START + ROOT_SECS + 33))
          truncate -s $((SLIM_SECS * 512)) ${OUT}/slim.raw
          # boot area: sfdisk below writes protective MBR + primary GPT + entries
          # + disk-end backup for the freshly sized file, so nothing needs to be
          # pre-seeded at LBA0. Only the U-Boot payload is copied in explicitly.
          dd if=firmware/u-boot.bin of=${OUT}/slim.raw bs=512 seek=64 conv=notrunc status=none
          dd if=build/base/02_boot.img of=${OUT}/slim.raw bs=512 seek=${BOOT_START} conv=notrunc status=none
          dd if=build/base/03_rootfs.img of=${OUT}/slim.raw bs=512 seek=${ROOT_START} conv=notrunc status=none
          cd ${OUT}
          sfdisk --force slim.raw <<PTABLE
          label: gpt
          unit: sectors
          slim.raw1 : start=${BOOT_START}, size=${BOOT_SECS}, type=0FC63DAF-8483-4772-8E79-3D69D8477DE4, name="boot"
          slim.raw2 : start=${ROOT_START}, size=${ROOT_SECS}, type=0FC63DAF-8483-4772-8E79-3D69D8477DE4, name="rootfs"
          PTABLE
          sfdisk -d slim.raw
          echo "slim: $(du -m slim.raw | cut -f1)MB (rootfs ${ROOT_SECS} sectors)"
          # sanity: slim 的 p1 应能挂载看到 extlinux
          LOOP=$(sudo losetup -Pf --show slim.raw)
          sudo mkdir -p /mnt/slimchk && sudo mount -o ro ${LOOP}p1 /mnt/slimchk
          sudo ls /mnt/slimchk/extlinux/extlinux.conf /mnt/slimchk/Image /mnt/slimchk/uInitrd > /dev/null && echo "slim p1 OK"
          sudo umount /mnt/slimchk && sudo losetup -d ${LOOP}
          # release ships compressed packages ONLY: full-disk image as .img.xz
          # (installer still accepts third-party .img.gz as INPUT; that is unaffected)
          xz -T0 -9 -k slim.raw && mv slim.raw.xz p3_armbian_full-${KERNEL_VER}.img.xz && rm slim.raw
          echo "full img.xz: $(du -m p3_armbian_full-${KERNEL_VER}.img.xz | cut -f1)MB"

          # ---- bootarea package: GPT + U-Boot as one 16MB block (MaskRom wl 0x0) ----
          truncate -s $((32768 * 512)) bootarea.img
          dd if=../../build/gpt/gpt.img of=bootarea.img bs=512 seek=0  conv=notrunc status=none
          dd if=../../firmware/u-boot.bin of=bootarea.img bs=512 seek=64 conv=notrunc status=none
          echo "bootarea.img: GPT@LBA0 + U-Boot@LBA64 (16MB, MaskRom one-shot wl 0x0)"

          # ---- 校验清单 ----
          sha256sum bootarea.img p3_armbian_full-${KERNEL_VER}.img.xz > SHA256SUMS.txt
          [ -f FIT_SHA256.txt ] && cat FIT_SHA256.txt >> SHA256SUMS.txt || true
          rm -f FIT_SHA256.txt   # merged into SHA256SUMS.txt above
          cat SHA256SUMS.txt
          # unique tag per build: kernel version + UTC timestamp, keeps history
          echo "FIRMWARE_TAG=firmware_${KERNEL_VER}_$(date -u +%Y%m%d-%H%M)" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}
        id: pack

      - name: Upload firmware set to Release
        uses: ophub/upload-to-releases@main
        if: ${{ steps.pack.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ env.FIRMWARE_TAG }}
          artifacts: build/output/*
          allow_updates: false
          remove_artifacts: false
          replaces_artifacts: false
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### P3 固件套件（CI 构建，内核 ${{ env.KERNEL_VER }}）

            | 格式 | 文件 | 用途 |
            |---|---|---|
            | **FIT（webflash）** | `p3-installer-${{ env.FIT_VER }}.fit` | **下载后直接网页上传，无需解压**（FIT 内部数据已是 xz）：预配置 Armbian 26.11 noble |
            | **整盘 img（直刷）** | `p3_armbian_full-${{ env.KERNEL_VER }}.img.xz` | 完整盘压缩包：GPT+U-Boot+boot+rootfs；Rufus/Etcher 可直接写 `.img.xz`，`dd` 前先 `unxz` |

            - 配套引导：U-Boot `${{ env.UBOOT_VER }}`（与 `SHA256SUMS.txt` / 二进制内嵌版本双向校验）
            - 首启自动配置：`root/password`、`bash`、去掉首登向导；首次开机自行换掉本机的 rootfs/boot UUID 后重启一次（约 10 秒）。
              这一步是为了让用同一镜像 dd 出来的 U 盘不再和 eMMC 共用 `root=UUID=`（否则“U 盘启动”会静默起 eMMC）。

            本 Release 只带四个文件：FIT、整盘 img.xz、bootarea.img、SHA256SUMS.txt。
            分件不再随版发布 —— 引导件内容极少变化，以仓库 `firmware/` 为准；
            boot/rootfs 基座在滚动 Release `base_firmware`（CI 内部源，仅在变化时更新）。

            | 需要分件时 | 去哪拿 | 刷写 |
            |---|---|---|
            | GPT / U-Boot 引导件 | 仓库 `firmware/`（或 `bootarea.img` 一件搞定） | GPT `wl 0x0` + U-Boot `wl 0x40`；bootarea 整包 `wl 0x0` |
            | 04_backup_gpt.img | 仓库 `firmware/` | 盘尾 `wl 0x01D1EFDF`（重建分区表后建议一并写入，否则 Linux 报 backup GPT 不一致） |
            | 02_boot.img / 03_rootfs.img | Release `base_firmware` | boot `wl 0x8000` / rootfs `wl 0xC8000` |

            - SHA256SUMS.txt 覆盖本 Release 全部文件；刷机命令见仓库 `firmware/README.md`

            ### 刷写方式说明

            本套件所有刷写路径只写入两个固定分区：boot（LBA32768 起）与
            rootfs（LBA819200 起）。LBA0-32767（GPT + U-Boot 引导区）与盘尾
            备份 GPT 不会被写入；写盘完成后逐段回读做 sha256 校验，不一致则
            停止并保留现场，不会带病重启。

            两种镜像形态：

            | 形态 | 打包 | 写盘行为 |
            |---|---|---|
            | P3WFS1（`.wfs`） | `tools/mkwebflash.sh` 打包，`p3wfs-check.sh` 自检，`mkfit.sh` 出 FIT | 头部声明写盘起点与内容 sha；installer 强制起点 ≥ LBA32768、不越盘尾，回读 sha 与头部声明比对 |
            | 自带 GPT 的整盘镜像（`.img` / `.img.xz` / `.img.gz`） | 无需预处理，`tools/mkfit.sh` 直接装 FIT | installer 在内存中读取镜像自身 GPT 定位 boot/rootfs，分别写入板上固定分区（boot @LBA32768、rootfs @LBA819200）；引导区不参与写入 |

            打包与自检脚本在仓库 `tools/`（`gptparse.c` 为整盘镜像的分区表读取工具）。

      - name: Refresh rolling base_firmware release (02/03, only if changed)
        if: ${{ steps.pack.outputs.status == 'success' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          B=build/base
          if gh release view base_firmware --repo ${KERNEL_REPO} >/dev/null 2>&1; then
            skip=0
            for f in 02_boot.img 03_rootfs.img; do
              want=$(sha256sum ${B}/${f} | awk '{print $1}')
              have=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${KERNEL_REPO}/releases/tags/base_firmware" | \
                jq -r --arg n "${f}" '.assets[] | select(.name==$n) | .digest // empty' | sed 's/^sha256://' || true)
              if [ "${want}" = "${have}" ]; then echo "${f}: unchanged"; skip=$((skip+1));
              else echo "${f}: changed/new"; fi
            done
            if [ "${skip}" = "2" ]; then echo "base unchanged, nothing to upload"; exit 0; fi
            gh release upload base_firmware --repo ${KERNEL_REPO} --clobber \
              ${B}/02_boot.img ${B}/03_rootfs.img
          else
            gh release create base_firmware --repo ${KERNEL_REPO} \
              --title "base firmware (rolling, CI internal)" \
              --notes "02_boot.img / 03_rootfs.img 滚动基座，构建固件的自动来源；内容仅在变化时更新。不是发布件，请勿从此处下载刷写。" \
              ${B}/02_boot.img ${B}/03_rootfs.img
          fi
